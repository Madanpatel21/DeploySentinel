apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploysentinel-api
  labels:
    app: deploysentinel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploysentinel-api
  template:
    metadata:
      labels:
        app: deploysentinel-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api
          image: ghcr.io/deploysentinel/api:1.0.0
          ports:
            - containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: deploysentinel-api
spec:
  selector:
    app: deploysentinel-api
  ports:
    - port: 80
      targetPort: 4000
