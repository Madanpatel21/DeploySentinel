<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="ReleaseGuard Enterprise Banner">
  <rect width="1200" height="180" rx="16" fill="#070C18"/>
  <rect x="1.5" y="1.5" width="1197" height="177" rx="15" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="12" y="1.5" width="1176" height="3" rx="1.5" fill="#06B6D4" opacity="0.75"/>

  <!-- Subtle architectural framing lines -->
  <line x1="36" y1="26" x2="1164" y2="26" stroke="#17223B" stroke-width="1"/>
  <line x1="36" y1="154" x2="1164" y2="154" stroke="#17223B" stroke-width="1"/>

  <!-- Isometric Hexagon + Shield Emblem -->
  <g transform="translate(56, 36)">
    <polygon points="54,4 100,30 100,80 54,106 8,80 8,30" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
    <polygon points="54,15 89,35 89,75 54,95 19,75 19,35" fill="#0B1326" stroke="#8B5CF6" stroke-width="1.5"/>
    <path d="M54 26 L77 36 V56 C77 71 66 82 54 87 C42 82 31 71 31 56 V36 Z" fill="#1D4ED8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2.2"/>
    <polyline points="43,55 51,63 66,47" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eyebrow Pill -->
  <rect x="196" y="34" width="380" height="24" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <circle cx="213" cy="46" r="4" fill="#34D399"/>
  <text x="226" y="50" fill="#67E8F9" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.4">DEVOPS INTELLIGENCE &amp; SRE CONTROL PLANE</text>

  <!-- Main Title -->
  <text x="196" y="102" fill="#F8FAFC" font-family="sans-serif" font-size="38" font-weight="800">ReleaseGuard Enterprise</text>

  <!-- Tagline -->
  <text x="198" y="133" fill="#CBD5E1" font-family="sans-serif" font-size="15">Know the risk before you release. Understand every change. Protect every deployment.</text>

  <!-- Right-side compact telemetry card -->
  <g transform="translate(926, 34)">
    <rect width="234" height="112" rx="12" fill="#0B1326" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="25" fill="#94A3B8" font-family="monospace" font-size="10.5" font-weight="700">CONTROL PLANE v1.0.0</text>
    <line x1="16" y1="34" x2="218" y2="34" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="55" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">RISK ENGINE</text>
    <text x="218" y="55" text-anchor="end" fill="#F8FAFC" font-family="monospace" font-size="11.5" font-weight="700">v2.1.0</text>
    <text x="16" y="76" fill="#A78BFA" font-family="monospace" font-size="11.5" font-weight="700">RBAC ROLES</text>
    <text x="218" y="76" text-anchor="end" fill="#F8FAFC" font-family="monospace" font-size="11.5" font-weight="700">9 / 32</text>
    <text x="16" y="97" fill="#F59E0B" font-family="monospace" font-size="11.5" font-weight="700">AUTO ROLLBACK</text>
    <text x="218" y="97" text-anchor="end" fill="#34D399" font-family="monospace" font-size="11.5" font-weight="700">OPT-IN</text>
  </g>
</svg>
